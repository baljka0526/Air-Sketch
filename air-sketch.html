<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Sketch</title>
<style>
:root{--bg:#e9ecef;--ink:#16181d;--bar:#ffffff;--line:#c9cdd3;--acc:#2457ff;--paper:#ffffff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--ink:#e8eaee;--bar:#1b1e25;--line:#343944;--acc:#7b9bff;--paper:#14161b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;background:var(--paper);overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px var(--line)}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.28}
video.off{opacity:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
#bar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:var(--bar);border:1px solid var(--line);border-radius:12px;z-index:3;max-width:98%;overflow-x:auto}
#bar button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:12px 12px;min-width:62px;cursor:pointer;white-space:nowrap}
#bar button:hover{border-color:var(--line)}
#bar button.on{background:var(--acc);color:#fff}
#bar button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#bar i{width:1px;background:var(--line);margin:4px 2px;flex:none}
#side{position:absolute;left:10px;top:84px;z-index:3;display:flex;flex-direction:column;gap:6px;width:204px;padding:6px;background:var(--bar);border:1px solid var(--line);border-radius:12px}
#side button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 6px;cursor:pointer;white-space:nowrap}
#side button:hover{border-color:var(--acc)}
#side button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#side button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#tabs{display:flex;gap:4px}
#tabs button{flex:1;padding:9px 2px;font-size:12.5px;border-color:transparent}
#tabs button.cur{box-shadow:inset 0 -2px 0 var(--acc);font-weight:600}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
#grid.icons{grid-template-columns:repeat(4,minmax(0,1fr))}
#grid.icons button{padding:7px 0;display:flex;align-items:center;justify-content:center}
#side canvas{position:static;width:28px;height:28px;pointer-events:none}
#msg{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:14px;z-index:3;pointer-events:none}
#msg span{background:var(--bar);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
#txt{position:absolute;z-index:5;display:none;font:22px system-ui,sans-serif;color:var(--ink);background:var(--bar);border:2px solid var(--acc);border-radius:6px;padding:4px 8px;min-width:160px;outline:none}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:6;background:var(--paper);text-align:center;padding:24px}
#start h1{margin:0;font-size:28px;letter-spacing:-.02em}
#start p{margin:0;max-width:48ch;opacity:.75}
#go{font:inherit;font-size:16px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:14px 26px;cursor:pointer}
#go:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="ink"></canvas>
  <canvas id="hud"></canvas>
  <div id="bar" role="toolbar" aria-label="Sketch tools">
    <button data-tool="pen" class="on">Pen</button>
    <button data-tool="line">Line</button>
    <i></i>
    <button data-tool="rect">Rectangle</button>
    <button data-tool="square">Square</button>
    <button data-tool="circle">Circle</button>
    <button data-tool="button">Button</button>
    <button data-tool="text">Text</button>
    <i></i>
    <button data-tool="move">Move</button>
    <button data-tool="erase">Erase</button>
    <i></i>
    <button data-act="undo">Undo</button>
    <button data-act="redo">Redo</button>
    <button data-act="clear">Clear</button>
    <button data-act="dup">Duplicate</button>
    <button data-act="cam">Camera</button>
    <button data-act="save">Save</button>
  </div>
  <input id="txt" type="text" autocomplete="off" aria-label="Text">
  <div id="side" role="toolbar" aria-label="UI components"></div>
  <div id="msg"><span id="msgText"></span></div>
  <div id="start">
    <h1>Air Sketch</h1>
    <p>Sketch UI wireframes in the air. Pinch thumb and index finger to draw, release to lift. Pinch a toolbar button to press it. Hold a peace sign (index and middle finger up, others folded) to duplicate the last item.</p>
    <button id="go">Start camera</button>
    <p id="err" role="alert"></p>
  </div>
</div>

<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = s => document.querySelector(s);
const stage = $('#stage'), video = $('#cam'), ink = $('#ink'), hud = $('#hud'), txt = $('#txt');
const ictx = ink.getContext('2d'), hctx = hud.getContext('2d');
let W = 0, H = 0;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  W = stage.clientWidth; H = stage.clientHeight;
  for (const c of [ink, hud]) { c.width = W*dpr; c.height = H*dpr; c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
  render();
}
addEventListener('resize', resize);

// ---- model ----
let strokes = [], cur = null, tool = 'pen', drag = null, typing = null;
const INK = () => getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#16181d';
const ln = (c,x1,y1,x2,y2) => { c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); };
const rr = (c,x,y,w,h,r) => { c.beginPath(); c.roundRect(x,y,w,h,Math.min(r,w/2,h/2)); c.stroke(); };
const ci = (c,cx,cy,r,fill) => { c.beginPath(); c.arc(cx,cy,Math.max(r,0),0,Math.PI*2); fill ? c.fill() : c.stroke(); };
const tx = (c,t,x,y,size,al,mw) => { c.font = `${size}px system-ui, sans-serif`; c.textAlign = al || 'left'; c.textBaseline = 'middle'; c.fillText(t,x,y,Math.max(10,mw||999)); };
const faint = (c,fn) => { c.save(); c.globalAlpha = .45; fn(); c.restore(); };
const chev = (c,x,y,s,d) => { c.beginPath();
  if (d === 'r') { c.moveTo(x-s/2,y-s); c.lineTo(x+s/2,y); c.lineTo(x-s/2,y+s); }
  else if (d === 'l') { c.moveTo(x+s/2,y-s); c.lineTo(x-s/2,y); c.lineTo(x+s/2,y+s); }
  else { c.moveTo(x-s,y-s/2); c.lineTo(x,y+s/2); c.lineTo(x+s,y-s/2); }
  c.stroke(); };
const xbox = (c,x,y,w,h) => { c.strokeRect(x,y,w,h); ln(c,x,y,x+w,y+h); ln(c,x+w,y,x,y+h); };
const pl = (c,X,Y,pts) => { c.beginPath(); pts.forEach(([a,b],i) => i ? c.lineTo(X(a),Y(b)) : c.moveTo(X(a),Y(b))); c.stroke(); };
const IC = (name, fn) => ({name, cat:'icons', size:[40,40], sq:1, draw:(c,x,y,w) => {
  c.lineWidth = Math.max(1.5, Math.min(3, w/14)); fn(c, f => x+w*f, f => y+w*f, w); }});

// common UI components, drawn inside the box the person drags out
const COMPS = {
  appbar:{name:'App bar', size:[360,56], label:'Title', edit:1, draw:(c,x,y,w,h,s) => {
    c.strokeRect(x,y,w,h); chev(c,x+22,y+h/2,Math.min(8,h*.2),'l');
    tx(c,s.label,x+w/2,y+h/2,Math.min(20,h*.4),'center',w-120);
    for (const d of [-6,0,6]) ln(c,x+w-34,y+h/2+d,x+w-14,y+h/2+d); }},
  tabbar:{name:'Tab bar', size:[360,64], draw:(c,x,y,w,h) => {
    c.strokeRect(x,y,w,h);
    for (let i = 0; i < 4; i++) { const cx = x+w*(i+.5)/4; ci(c,cx,y+h*.38,h*.15,i===0); faint(c,() => ln(c,cx-h*.2,y+h*.75,cx+h*.2,y+h*.75)); } }},
  input:{name:'Input', size:[260,46], label:'Email', edit:1, draw:(c,x,y,w,h,s) => {
    rr(c,x,y,w,h,8); faint(c,() => tx(c,s.label,x+14,y+h/2,Math.min(18,h*.4),'left',w-28)); }},
  search:{name:'Search', size:[260,44], label:'Search', edit:1, draw:(c,x,y,w,h,s) => {
    rr(c,x,y,w,h,h); ci(c,x+h*.5,y+h*.46,h*.15); ln(c,x+h*.61,y+h*.57,x+h*.72,y+h*.68);
    faint(c,() => tx(c,s.label,x+h*.95,y+h/2,Math.min(18,h*.4),'left',w-h*1.3)); }},
  dropdown:{name:'Dropdown', size:[220,46], label:'Select', edit:1, draw:(c,x,y,w,h,s) => {
    rr(c,x,y,w,h,8); tx(c,s.label,x+14,y+h/2,Math.min(18,h*.4),'left',w-52); chev(c,x+w-22,y+h/2,6,'d'); }},
  checkbox:{name:'Checkbox', size:[190,28], label:'Remember me', edit:1, draw:(c,x,y,w,h,s) => {
    const b = h*.78, by = y+(h-b)/2; rr(c,x,by,b,b,4);
    c.beginPath(); c.moveTo(x+b*.22,y+h/2); c.lineTo(x+b*.42,y+h/2+b*.2); c.lineTo(x+b*.8,y+h/2-b*.22); c.stroke();
    tx(c,s.label,x+b+10,y+h/2,Math.min(20,h*.65),'left',w-b-12); }},
  radio:{name:'Radio', size:[170,28], label:'Option', edit:1, draw:(c,x,y,w,h,s) => {
    ci(c,x+h*.5,y+h/2,h*.4); ci(c,x+h*.5,y+h/2,h*.18,1);
    tx(c,s.label,x+h+8,y+h/2,Math.min(20,h*.65),'left',w-h-10); }},
  toggle:{name:'Toggle', size:[56,30], draw:(c,x,y,w,h) => { rr(c,x,y,w,h,h); ci(c,x+w-h/2,y+h/2,h*.32,1); }},
  slider:{name:'Slider', size:[220,24], draw:(c,x,y,w,h) => {
    faint(c,() => ln(c,x,y+h/2,x+w,y+h/2));
    c.save(); c.lineWidth = 6; ln(c,x,y+h/2,x+w*.6,y+h/2); c.restore(); ci(c,x+w*.6,y+h/2,h*.4,1); }},
  card:{name:'Card', size:[240,200], label:'Card title', edit:1, draw:(c,x,y,w,h,s) => {
    rr(c,x,y,w,h,12); const ih = h*.5; xbox(c,x+10,y+10,w-20,ih);
    const ty = y+10+ih+h*.12; tx(c,s.label,x+14,ty,Math.min(18,h*.1+4),'left',w-28);
    faint(c,() => { ln(c,x+14,ty+h*.12,x+w-14,ty+h*.12); ln(c,x+14,ty+h*.2,x+w*.6,ty+h*.2); }); }},
  listitem:{name:'List item', size:[320,64], label:'List item', edit:1, draw:(c,x,y,w,h,s) => {
    rr(c,x,y,w,h,8); ci(c,x+h*.5,y+h/2,h*.28);
    tx(c,s.label,x+h*.95,y+h*.38+0,Math.min(18,h*.3),'left',w-h*1.6);
    faint(c,() => ln(c,x+h*.95,y+h*.68,x+h*.95+(w-h*1.6)*.55,y+h*.68)); chev(c,x+w-18,y+h/2,6,'r'); }},
  avatar:{name:'Avatar', size:[56,56], sq:1, draw:(c,x,y,w,h) => {
    ci(c,x+w/2,y+h/2,w/2); c.save(); c.beginPath(); c.arc(x+w/2,y+h/2,w/2,0,Math.PI*2); c.clip();
    ci(c,x+w/2,y+h*.4,w*.17); c.beginPath(); c.arc(x+w/2,y+h*.95,w*.32,Math.PI,0); c.stroke(); c.restore(); }},
  image:{name:'Image', size:[200,140], draw:(c,x,y,w,h) => xbox(c,x,y,w,h)},

  web:{name:'Web', cat:'devices', size:[640,400], frame:1, draw:(c,x,y,w,h) => {
    rr(c,x,y,w,h,10); const bh = Math.min(38,h*.14);
    ln(c,x,y+bh,x+w,y+bh);
    [14,28,42].forEach(d => ci(c,x+d,y+bh/2,Math.min(4,bh*.12),1));
    rr(c,x+64,y+bh*.2,Math.max(10,w-78),bh*.6,bh*.3);
    faint(c,() => tx(c,'example.com',x+80,y+bh/2,Math.min(14,bh*.38),'left',w-110)); }},
  mobile:{name:'Mobile', cat:'devices', size:[240,480], frame:1, draw:(c,x,y,w,h) => {
    const r = Math.min(34,w*.16), m = Math.min(9,w*.04);
    rr(c,x,y,w,h,r); rr(c,x+m,y+m,w-2*m,h-2*m,Math.max(4,r-m));
    rr(c,x+w*.35,y+m+8,w*.3,Math.min(14,h*.03),8);
    faint(c,() => ln(c,x+w*.35,y+h-m-14,x+w*.65,y+h-m-14)); }},

  i_home:IC('Home', (c,X,Y,w) => {
    pl(c,X,Y,[[.12,.5],[.5,.15],[.88,.5]]); pl(c,X,Y,[[.22,.42],[.22,.85],[.78,.85],[.78,.42]]); pl(c,X,Y,[[.42,.85],[.42,.62],[.58,.62],[.58,.85]]); }),
  i_search:IC('Search', (c,X,Y,w) => { ci(c,X(.44),Y(.44),w*.27); pl(c,X,Y,[[.64,.64],[.86,.86]]); }),
  i_user:IC('User', (c,X,Y,w) => { ci(c,X(.5),Y(.3),w*.19); c.beginPath(); c.arc(X(.5),Y(.92),w*.34,Math.PI,0); c.stroke(); }),
  i_heart:IC('Heart', (c,X,Y) => { c.beginPath(); c.moveTo(X(.5),Y(.85)); c.bezierCurveTo(X(.05),Y(.55),X(.15),Y(.15),X(.5),Y(.36)); c.bezierCurveTo(X(.85),Y(.15),X(.95),Y(.55),X(.5),Y(.85)); c.stroke(); }),
  i_star:IC('Star', (c,X,Y,w) => { c.beginPath();
    for (let i = 0; i < 10; i++) { const r = (i%2 ? .2 : .43)*w, a = -Math.PI/2 + i*Math.PI/5, px = X(.5)+Math.cos(a)*r, py = Y(.53)+Math.sin(a)*r; i ? c.lineTo(px,py) : c.moveTo(px,py); }
    c.closePath(); c.stroke(); }),
  i_bell:IC('Bell', (c,X,Y,w) => { c.beginPath(); c.moveTo(X(.2),Y(.72)); c.bezierCurveTo(X(.3),Y(.62),X(.3),Y(.5),X(.3),Y(.42)); c.bezierCurveTo(X(.3),Y(.15),X(.7),Y(.15),X(.7),Y(.42)); c.bezierCurveTo(X(.7),Y(.5),X(.7),Y(.62),X(.8),Y(.72)); c.closePath(); c.stroke(); ci(c,X(.5),Y(.85),w*.06,1); }),
  i_settings:IC('Settings', (c,X,Y,w) => { ci(c,X(.5),Y(.5),w*.14); ci(c,X(.5),Y(.5),w*.28);
    for (let i = 0; i < 8; i++) { const a = i*Math.PI/4; ln(c,X(.5)+Math.cos(a)*w*.28,Y(.5)+Math.sin(a)*w*.28,X(.5)+Math.cos(a)*w*.4,Y(.5)+Math.sin(a)*w*.4); } }),
  i_menu:IC('Menu', (c,X,Y) => { for (const y of [.3,.5,.7]) pl(c,X,Y,[[.2,y],[.8,y]]); }),
  i_close:IC('Close', (c,X,Y) => { pl(c,X,Y,[[.25,.25],[.75,.75]]); pl(c,X,Y,[[.75,.25],[.25,.75]]); }),
  i_plus:IC('Plus', (c,X,Y) => { pl(c,X,Y,[[.5,.2],[.5,.8]]); pl(c,X,Y,[[.2,.5],[.8,.5]]); }),
  i_check:IC('Check', (c,X,Y) => pl(c,X,Y,[[.2,.55],[.42,.75],[.82,.28]])),
  i_mail:IC('Mail', (c,X,Y,w) => { rr(c,X(.1),Y(.25),w*.8,w*.5,3); pl(c,X,Y,[[.1,.28],[.5,.58],[.9,.28]]); }),
  i_cart:IC('Cart', (c,X,Y,w) => { pl(c,X,Y,[[.08,.2],[.24,.2],[.34,.62],[.8,.62],[.9,.32],[.27,.32]]); ci(c,X(.42),Y(.8),w*.06); ci(c,X(.72),Y(.8),w*.06); }),
  i_camera:IC('Camera', (c,X,Y,w) => { rr(c,X(.08),Y(.3),w*.84,w*.55,4); ci(c,X(.5),Y(.58),w*.16); pl(c,X,Y,[[.34,.3],[.4,.18],[.6,.18],[.66,.3]]); }),
  i_pin:IC('Location', (c,X,Y,w) => { c.beginPath(); c.moveTo(X(.5),Y(.92)); c.bezierCurveTo(X(.15),Y(.55),X(.2),Y(.12),X(.5),Y(.12)); c.bezierCurveTo(X(.8),Y(.12),X(.85),Y(.55),X(.5),Y(.92)); c.stroke(); ci(c,X(.5),Y(.4),w*.1); }),
  i_trash:IC('Trash', (c,X,Y) => { pl(c,X,Y,[[.18,.27],[.82,.27]]); pl(c,X,Y,[[.4,.27],[.4,.16],[.6,.16],[.6,.27]]); pl(c,X,Y,[[.26,.27],[.31,.86],[.69,.86],[.74,.27]]); })
};
const SHAPES = ['rect','square','circle','button', ...Object.keys(COMPS)];
const DEFAULT = {rect:[180,110], square:[110,110], circle:[110,110], button:[150,46],
  ...Object.fromEntries(Object.entries(COMPS).map(([k,v]) => [k, v.size]))};
const side = $('#side');
const CATS = [['devices','Devices'], ['components','UI'], ['icons','Icons']];
let cat = 'devices';
function markTools(){ document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === tool)); }
function renderSide(){
  side.innerHTML = '<div id="tabs">' + CATS.map(([k,n]) => `<button data-cat="${k}" class="${k === cat ? 'cur' : ''}">${n}</button>`).join('') + `</div><div id="grid" class="${cat}"></div>`;
  const grid = side.querySelector('#grid');
  for (const [k,v] of Object.entries(COMPS)) {
    if ((v.cat || 'components') !== cat) continue;
    const b = document.createElement('button');
    b.dataset.tool = k; b.title = v.name; b.setAttribute('aria-label', v.name);
    if (cat === 'icons') {
      const cv = document.createElement('canvas'); cv.width = cv.height = 56;
      const g = cv.getContext('2d'); g.strokeStyle = g.fillStyle = INK(); g.lineCap = g.lineJoin = 'round';
      v.draw(g, 8, 8, 40, 40, {label:''}); b.appendChild(cv);
    } else b.textContent = v.name;
    grid.appendChild(b);
  }
  markTools();
}
side.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cat) { cat = b.dataset.cat; renderSide(); } else setTool(b.dataset.tool);
});
renderSide();
const HINT = {
  pen:'Pinch to draw freehand', line:'Pinch and drag to draw a line',
  rect:'Drag to size a rectangle, or just tap to drop one', square:'Drag to size a square, or just tap to drop one',
  circle:'Drag to size a circle, or just tap to drop one', button:'Drag to size a button, or just tap to drop one, then type its label',
  text:'Pinch where the text goes, then type and press Enter', move:'Pinch a shape and drag it', erase:'Pinch and sweep over strokes to delete them'
};

for (const k in COMPS) HINT[k] = 'Drag to size it, or just tap to drop one';
// bounding box of a shape, constrained for square/circle
function box(s){
  const [x1,y1] = s.a; let dx = s.b[0]-x1, dy = s.b[1]-y1;
  if (s.t === 'square' || s.t === 'circle' || COMPS[s.t]?.sq) {
    const m = Math.max(Math.abs(dx), Math.abs(dy));
    dx = (dx < 0 ? -1 : 1) * m; dy = (dy < 0 ? -1 : 1) * m;
  }
  return {x: Math.min(x1, x1+dx), y: Math.min(y1, y1+dy), w: Math.abs(dx), h: Math.abs(dy)};
}
function textSize(s){ ictx.font = `${s.size}px system-ui, sans-serif`; return ictx.measureText(s.text).width; }

function drawStroke(c, s){
  c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath();
  if (s.t === 'pen') {
    s.p.forEach((p,i) => i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1]));
    if (s.p.length === 1) c.lineTo(s.p[0][0]+.1, s.p[0][1]);
    c.stroke();
  } else if (s.t === 'line') {
    c.moveTo(s.a[0],s.a[1]); c.lineTo(s.b[0],s.b[1]); c.stroke();
  } else if (s.t === 'text') {
    c.font = `${s.size}px system-ui, sans-serif`; c.textBaseline = 'middle'; c.textAlign = 'left';
    c.fillText(s.text, s.a[0], s.a[1]);
  } else if (COMPS[s.t]) {
    const {x,y,w,h} = box(s); COMPS[s.t].draw(c,x,y,w,h,s);
  } else {
    const {x,y,w,h} = box(s);
    if (s.t === 'circle') c.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2);
    else if (s.t === 'button') c.roundRect(x, y, w, h, Math.min(14, h/2));
    else c.rect(x, y, w, h);
    c.stroke();
    if (s.t === 'button') {
      c.font = `${Math.max(12, Math.min(24, h*0.42))}px system-ui, sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(s.label, x+w/2, y+h/2, Math.max(10, w-16));
    }
  }
}
function render(){
  ictx.clearRect(0,0,W,H);
  strokes.forEach(s => drawStroke(ictx,s));
  if (cur) drawStroke(ictx,cur);
}

// line segments of a stroke, used for erase / move hit-testing
function segs(s){
  if (s.t === 'pen') return s.p.length === 1 ? [[...s.p[0],...s.p[0]]] : s.p.slice(1).map((p,i) => [s.p[i][0],s.p[i][1],p[0],p[1]]);
  if (s.t === 'line') return [[...s.a,...s.b]];
  let x,y,w,h;
  if (s.t === 'text') { x = s.a[0]; y = s.a[1]-s.size/2; w = textSize(s); h = s.size; }
  else ({x,y,w,h} = box(s));
  if (s.t === 'circle') {
    const out = [], n = 28;
    for (let i = 0; i < n; i++) {
      const a1 = i/n*Math.PI*2, a2 = (i+1)/n*Math.PI*2;
      out.push([x+w/2+Math.cos(a1)*w/2, y+h/2+Math.sin(a1)*h/2, x+w/2+Math.cos(a2)*w/2, y+h/2+Math.sin(a2)*h/2]);
    }
    return out;
  }
  const r = [[x,y,x+w,y],[x+w,y,x+w,y+h],[x+w,y+h,x,y+h],[x,y+h,x,y]];
  if (s.t === 'text') r.push([x,y+h/2,x+w,y+h/2]);
  return r;
}
function distSeg(px,py,[x1,y1,x2,y2]){
  const dx = x2-x1, dy = y2-y1, l = dx*dx+dy*dy;
  let t = l ? ((px-x1)*dx+(py-y1)*dy)/l : 0; t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
const hit = (s,x,y,r) => {
  if (COMPS[s.t] && !COMPS[s.t].frame) { const b = box(s); return x > b.x-r && x < b.x+b.w+r && y > b.y-r && y < b.y+b.h+r; }
  return segs(s).some(g => distSeg(x,y,g) < r);
};
let eraseCp = false;
function eraseAt(x,y){
  const kept = strokes.filter(s => !hit(s,x,y,24));
  if (kept.length === strokes.length) return;
  if (!eraseCp) { checkpoint(); eraseCp = true; }
  strokes = kept; render();
}
function shift(s,dx,dy){
  if (s.p) s.p.forEach(p => { p[0]+=dx; p[1]+=dy; });
  if (s.a) { s.a[0]+=dx; s.a[1]+=dy; }
  if (s.b) { s.b[0]+=dx; s.b[1]+=dy; }
}

// ---- undo / redo: every change (draw, erase, move, duplicate, clear) is one step ----
let undoStack = [], redoStack = [];
const snap = () => structuredClone(strokes);
function checkpoint(){ undoStack.push(snap()); if (undoStack.length > 100) undoStack.shift(); redoStack = []; }
function undo(){
  if (!undoStack.length) { flash('Nothing to undo'); return; }
  redoStack.push(snap()); strokes = undoStack.pop(); cur = null; drag = null; render(); flash('Undone');
}
function redo(){
  if (!redoStack.length) { flash('Nothing to redo'); return; }
  undoStack.push(snap()); strokes = redoStack.pop(); cur = null; drag = null; render(); flash('Redone');
}
function flash(t){ setMsg(t); setTimeout(() => setMsg(HINT[tool]), 1300); }
function duplicate(){
  const last = strokes[strokes.length-1];
  if (!last) { flash('Nothing to duplicate yet'); return; }
  const c = structuredClone(last); shift(c, 24, 24); checkpoint(); strokes.push(c); render();
  flash('Duplicated. Use Move to place the copy');
}

// ---- text entry (keyboard) ----
function openInput(s, x, y, w, value){
  typing = s;
  Object.assign(txt.style, {display:'block', left:x+'px', top:y+'px', width:w+'px'});
  txt.value = value; txt.focus(); txt.select();
  setMsg('Type, then press Enter');
}
function closeInput(commit){
  if (!typing) return;
  const s = typing; typing = null;
  const v = txt.value.trim();
  txt.style.display = 'none';
  if (commit) {
    if (s.t !== 'text') { if (v) s.label = v; }
    else if (v) { s.text = v; checkpoint(); strokes.push(s); }
  }
  setMsg(HINT[tool]); render();
}
txt.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); closeInput(true); }
  if (e.key === 'Escape') { e.preventDefault(); closeInput(false); }
});
txt.addEventListener('blur', () => closeInput(true));

// ---- toolbar ----
function setMsg(t){ $('#msgText').textContent = t; }
function setTool(t){
  closeInput(true); endStroke(); tool = t;
  markTools();
  setMsg(HINT[t]);
}
function act(a){
  if (a === 'undo') undo();
  if (a === 'redo') redo();
  if (a === 'clear') { if (strokes.length) checkpoint(); strokes = []; cur = null; render(); }
  if (a === 'dup') duplicate();
  if (a === 'cam') video.classList.toggle('off');
  if (a === 'save') {
    const c = document.createElement('canvas'); c.width = W*2; c.height = H*2;
    const x = c.getContext('2d'); x.scale(2,2); x.fillStyle = '#fff'; x.fillRect(0,0,W,H);
    strokes.forEach(s => drawStroke(x, {...s, color:'#16181d'}));
    const l = document.createElement('a'); l.download = 'sketch.png'; l.href = c.toDataURL('image/png'); l.click();
  }
}
$('#bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  b.dataset.tool ? setTool(b.dataset.tool) : act(b.dataset.act);
});
addEventListener('keydown', e => {
  if (typing) return;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z') { e.preventDefault(); act(e.shiftKey ? 'redo' : 'undo'); }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y') { e.preventDefault(); act('redo'); }
  if (e.key.toLowerCase()==='d' && !e.ctrlKey && !e.metaKey) act('dup');
  const k = ['pen','line','rect','square','circle','button','text','move','erase'][+e.key - 1]; if (k) setTool(k);
});

// ---- hand tracking ----
const PINCH_ON = 0.30, PINCH_OFF = 0.42, SMOOTH = 0.35, HOLD_MS = 450;
let landmarker, pos = null, pinching = false, lost = 0, lastT = -1, hoverBtn = null;

async function start(){
  const go = $('#go'); go.disabled = true; go.textContent = 'Loading hand model…';
  try {
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: {modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "GPU"},
      runningMode: "VIDEO", numHands: 1
    });
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play();
    $('#start').remove();
    setMsg(HINT[tool]); resize(); loop();
  } catch (e) {
    go.disabled = false; go.textContent = 'Try again';
    $('#err').textContent = 'Could not start: ' + (e && e.message ? e.message : e) + '. Allow camera access and check your internet connection (the hand model loads online).';
  }
}
$('#go').addEventListener('click', start);

function loop(){
  requestAnimationFrame(loop);
  if (video.currentTime === lastT) return;
  lastT = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  hctx.clearRect(0,0,W,H);
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) {
    if (++lost > 6) { endStroke(); pinching = false; pos = null; vSince = 0; vDone = false; }
    return;
  }
  lost = 0;
  const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
  const ratio = d(lm[4], lm[8]) / (d(lm[0], lm[9]) || 1);
  const tx = (1 - (lm[4].x + lm[8].x)/2) * W;
  const ty = ((lm[4].y + lm[8].y)/2) * H;
  pos = pos ? [pos[0]+(tx-pos[0])*SMOOTH, pos[1]+(ty-pos[1])*SMOOTH] : [tx,ty];

  const was = pinching;
  // peace sign: index + middle extended, ring + pinky folded
  const ext = (t,pp) => d(lm[t], lm[0]) / (d(lm[pp], lm[0]) || 1);
  const isV = ext(8,6) > 1.25 && ext(12,10) > 1.25 && ext(16,14) < 1.08 && ext(20,18) < 1.08;
  pinching = !isV && (was ? ratio < PINCH_OFF : ratio < PINCH_ON);
  vGesture(isV, lm);

  const r = stage.getBoundingClientRect();
  const el = document.elementFromPoint(r.left+pos[0], r.top+pos[1]);
  const btn = el && el.closest && el.closest('#bar button, #side button');
  if (btn !== hoverBtn) { hoverBtn && (hoverBtn.style.borderColor=''); hoverBtn = btn; btn && (btn.style.borderColor='var(--acc)'); }

  if (typing) { hudCursor(false); return; }
  if (pinching && !was) {
    if (btn) { btn.click(); pinching = false; hudCursor(false); return; }
    beginStroke();
  } else if (pinching && was) moveStroke();
  else if (!pinching && was) endStroke();
  hudCursor(pinching);
}

let vSince = 0, vDone = false;
function vGesture(on, lm){
  if (!on) { vSince = 0; vDone = false; return; }
  const now = performance.now();
  if (!vSince) vSince = now;
  if (vDone) return;
  const k = Math.min(1, (now - vSince) / HOLD_MS);
  hctx.beginPath(); hctx.arc((1 - lm[9].x) * W, lm[9].y * H, 26, -Math.PI/2, -Math.PI/2 + k*Math.PI*2);
  hctx.lineWidth = 5; hctx.strokeStyle = '#2457ff'; hctx.stroke();
  if (k >= 1) { vDone = true; duplicate(); }
}
function hudCursor(down){
  if (!pos) return;
  hctx.beginPath(); hctx.arc(pos[0], pos[1], tool==='erase' ? 24 : (down ? 7 : 11), 0, Math.PI*2);
  hctx.lineWidth = 2; hctx.strokeStyle = '#2457ff'; hctx.fillStyle = down ? 'rgba(36,87,255,.35)' : 'rgba(36,87,255,.08)';
  hctx.fill(); hctx.stroke();
}
function beginStroke(){
  const p = [pos[0], pos[1]];
  if (tool === 'erase') { eraseCp = false; eraseAt(p[0], p[1]); return; }
  if (tool === 'move') {
    for (let i = strokes.length-1; i >= 0; i--) if (hit(strokes[i], p[0], p[1], 24)) { drag = {s:strokes[i], last:p}; break; }
    return;
  }
  if (tool === 'text') {
    openInput({t:'text', a:p, text:'', size:22, color:INK()}, p[0], p[1]-20, 220, '');
    return;
  }
  if (tool === 'pen') cur = {t:'pen', p:[p], color:INK()};
  else if (tool === 'line') cur = {t:'line', a:p, b:[...p], color:INK()};
  else cur = {t:tool, a:p, b:[...p], color:INK(), label:COMPS[tool]?.label ?? 'Button'};
  render();
}
function moveStroke(){
  const p = [pos[0], pos[1]];
  if (tool === 'erase') { eraseAt(p[0], p[1]); return; }
  if (drag) { if (!drag.cp) { checkpoint(); drag.cp = true; } shift(drag.s, p[0]-drag.last[0], p[1]-drag.last[1]); drag.last = p; render(); return; }
  if (!cur) return;
  if (cur.t === 'pen') {
    const l = cur.p[cur.p.length-1];
    if (Math.hypot(p[0]-l[0], p[1]-l[1]) > 2) cur.p.push(p);
  } else cur.b = p;
  render();
}
function endStroke(){
  drag = null; eraseCp = false;
  if (!cur) return;
  const s = cur; cur = null;
  const tiny = Math.hypot(s.b ? s.b[0]-s.a[0] : 99, s.b ? s.b[1]-s.a[1] : 99) < 12;
  if (s.t !== 'pen' && tiny) {
    if (!SHAPES.includes(s.t)) { render(); return; }
    // tap: drop a default-size shape centred on the finger
    const [w,h] = DEFAULT[s.t];
    s.a = [s.a[0]-w/2, s.a[1]-h/2]; s.b = [s.a[0]+w, s.a[1]+h];
  }
  checkpoint(); strokes.push(s); render();
  if (s.t === 'button' || COMPS[s.t]?.edit) {
    const {x,y,w,h} = box(s);
    openInput(s, x, y+h/2-20, Math.max(120, w), s.label);
  }
}
setMsg(HINT[tool]);
resize();
</script>
</body>
</html>
